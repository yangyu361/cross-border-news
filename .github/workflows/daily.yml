name: 跨境早报每日推送

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-daily]

jobs:
  generate-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-zenhei fonts-wqy-microhei fonts-noto-cjk
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install pillow --quiet
      - name: 生成今日早报图片
        run: python3 generate.py
      - name: 推送到微信
        env:
          SERVERCHAN_SCKEY: ${{ secrets.SERVERCHAN_SCKEY }}
        run: python3 push.py
      - name: 上传备份
        uses: actions/upload-artifact@v4
        with:
          name: daily-news
          path: cross_border_daily.png
          retention-days: 7
